<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Earthfall infestation shader demo</title><style>body{margin:0;background:#08121f;color:#e9dfcd;font:15px system-ui}header{padding:12px}#view{width:100vw;height:75vh}button{min-height:44px;background:#24384a;color:white;border:1px solid #bd9862;border-radius:5px;padding:8px 14px}</style></head><body><header><b>Infestation FX — WebGL1 preview</b> <button id="toggle">Pause</button><span id="status"></span></header><div id="view"></div><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><script src="../../assets/fx/infestation.js"></script><script>
const el=document.getElementById('view'),scene=new THREE.Scene(),camera=new THREE.OrthographicCamera(-1,1,1,-1,0.1,10);camera.position.z=2;
const canvas=document.createElement('canvas');canvas.width=canvas.height=128;const ctx=canvas.getContext('2d');const im=ctx.createImageData(128,128);
for(let y=0;y<128;y++)for(let x=0;x<128;x++){const i=(y*128+x)*4;const n=Math.sin(x*.33+Math.sin(y*.17))*Math.cos(y*.24);im.data[i]=95+45*n;im.data[i+1]=14+10*n;im.data[i+2]=18+8*n;im.data[i+3]=255}ctx.putImageData(im,0,0);
const tex=new THREE.CanvasTexture(canvas);tex.wrapS=tex.wrapT=THREE.RepeatWrapping;
const glsl=window.EARTHFALL_FX.infestation.glsl;
const mat=new THREE.ShaderMaterial({uniforms:{time:{value:0},tex:{value:tex}},vertexShader:'varying vec2 vUv; void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',fragmentShader:'precision mediump float; varying vec2 vUv; uniform float time; uniform sampler2D tex;'+glsl+'void main(){vec2 d=vUv-vec2(.52,.52);float dist=length(d*vec2(1.3,1.0));float inside=1.0-smoothstep(.31,.34,dist);float edge=(1.0-smoothstep(.0,.045,abs(dist-.32)))*inside;vec3 base=vec3(.16,.27,.27)+.05*sin(vUv.x*30.0)*sin(vUv.y*20.0);gl_FragColor=vec4(efInfest(base,vUv,time,inside,edge,tex),1.0);}'});
scene.add(new THREE.Mesh(new THREE.PlaneBufferGeometry(2,2),mat));const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));el.appendChild(renderer.domElement);function resize(){renderer.setSize(el.clientWidth,el.clientHeight)}window.addEventListener('resize',resize);resize();let paused=false,last=performance.now();document.getElementById('toggle').onclick=()=>{paused=!paused;document.getElementById('toggle').textContent=paused?'Play':'Pause'};function frame(now){const dt=Math.min((now-last)/1000,.05);last=now;if(!paused)mat.uniforms.time.value+=dt;renderer.render(scene,camera);requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></body></html>
