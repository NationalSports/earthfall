<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Earthfall combat FX demo</title><style>body{margin:0;background:#08121e;color:#f5e6cf;font:15px system-ui}header{padding:10px;display:flex;flex-wrap:wrap;gap:8px}button{min-height:44px;padding:8px 13px;background:#19354a;color:#fff;border:1px solid #c69b62;border-radius:6px}#view{width:100vw;height:78vh}</style></head><body><header><button data-fx="missileTrail">Missile</button><button data-fx="explosion">Explosion</button><button data-fx="empRing">EMP</button><button data-fx="nukeFlash">Nuke</button></header><div id="view"></div><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><script src="../../assets/fx/combat.js"></script><script>
const el=document.getElementById('view'),scene=new THREE.Scene();scene.background=new THREE.Color(0x08121e);
const camera=new THREE.PerspectiveCamera(55,1,.1,300);camera.position.set(0,22,32);camera.lookAt(0,0,0);
const plane=new THREE.Mesh(new THREE.PlaneBufferGeometry(120,67.5),new THREE.MeshBasicMaterial({color:0x172737,side:THREE.DoubleSide}));plane.rotation.x=-Math.PI/2;plane.position.y=-.04;scene.add(plane);
const grid=new THREE.GridHelper(45,20,0x456070,0x253948);scene.add(grid);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));el.appendChild(renderer.domElement);
function resize(){renderer.setSize(el.clientWidth,el.clientHeight);camera.aspect=el.clientWidth/el.clientHeight;camera.updateProjectionMatrix()}window.addEventListener('resize',resize);resize();
let effects=[];document.querySelectorAll('[data-fx]').forEach(b=>b.onclick=()=>{const k=b.dataset.fx;const opts=k==='missileTrail'?{from:new THREE.Vector3(-9,.6,0),to:new THREE.Vector3(7,.6,0)}:{};const fx=window.EARTHFALL_FX.combat[k](opts);scene.add(fx.object);effects.push({fx,t:0})});
let last=performance.now();function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;for(let i=effects.length-1;i>=0;i--){let e=effects[i];e.t+=dt;e.fx.update(e.t);if(e.t>=e.fx.duration){scene.remove(e.fx.object);e.fx.dispose();effects.splice(i,1)}}renderer.render(scene,camera);requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></body></html>
