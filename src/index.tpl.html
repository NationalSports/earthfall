<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Earthfall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Barlow+Semi+Condensed:wght@400;500;600&display=swap" rel="stylesheet">
<style>/*CSS*/</style>
</head>
<body>
<header id="top"></header>
<main>
  <section id="map" aria-label="World map">
    <div id="toasts" aria-live="polite"></div>
    <div class="legend"><span><i style="background:#2e969c"></i>Coalition held</span><span><i style="background:#b03a2e"></i>Occupied</span><span><i style="background:#3a3430"></i>Wasteland</span><span>♛ ★ ▲ Overlord, Warlord, Commander</span><span>◆ Strike team (white marker)</span></div>
    <button id="ptoggle" data-a="ptoggle">Orders</button>
    <div class="mapctl"><button data-a="globe" class="viewbtn">Globe</button><button data-a="mute" aria-label="Sound on or off">🔊</button><button data-a="rotL" aria-label="Rotate left">⟲</button><button data-a="tilt" aria-label="Change tilt">◭</button><button data-a="rotR" aria-label="Rotate right">⟳</button><button data-a="zoomOut" aria-label="Zoom out">−</button><button data-a="fit" aria-label="Fit map">⤢</button><button data-a="zoomIn" aria-label="Zoom in">+</button></div>
  </section>
  <aside id="panel"></aside>
</main>
<div id="modal" role="dialog" aria-modal="true"></div>
<!--THREE-->
<script>
/*JS*/
</script>
</body>
</html>
