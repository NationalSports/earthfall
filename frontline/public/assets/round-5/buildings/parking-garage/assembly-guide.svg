opacity="1" stroke="#668780"/><rect x="1189.125" y="414" width="33.0" height="49" rx="3" fill="#11232d" fill-opacity="1" stroke="#80ced1"/><text x="690" y="250" font-size="16" style="fill:#a9b8b5" >Repeat bays; reserve central ground bay for entrance.</text><text x="690" y="504" font-size="18" style="fill:#edf1ed" >Front: 8 × 3 m   |   Side: 6 × 3 m</text><text x="690" y="552" font-size="19" style="fill:#c6d3cd" >01  Foundation / floor slab</text><text x="690" y="586" font-size="19" style="fill:#c6d3cd" >02  Open bay / concrete columns</text><text x="690" y="620" font-size="19" style="fill:#c6d3cd" >03  Entrance / loading or ramp bay</text><text x="690" y="654" font-size="19" style="fill:#c6d3cd" >04  Corner pier / edge trim</text><text x="690" y="688" font-size="19" style="fill:#c6d3cd" >05  Roof tile / parapet edge</text><text x="690" y="722" font-size="19" style="fill:#c6d3cd" >06  Fractured corner / attached debris</text><text x="55" y="850" font-size="21" style="fill:#edf1ed" >Build the shell → repeat façade bays → cap roof → add service props → swap damaged corner.</text><text x="55" y="895" font-size="18" style="fill:#a9b8b5" >Dimensions are design targets. Model the selected front view as authority; reconcile generated view drift.</text><text x="55" y="930" font-size="17" style="fill:#a9b8b5" >Guide is an editable assembly schematic. PNG references are whole-building Meshy inputs, not separate modules.</text></svg>