<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="1000" viewBox="0 0 1600 1000"><style>text{font-family:Arial,Helvetica,sans-serif;fill:#edf1ed} .mono{font-family:Menlo,monospace}</style><rect x="0" y="0" width="1600" height="1000" rx="4" fill="#101a20" fill-opacity="1" stroke="#101a20"/><text x="55" y="62" font-size="18" style="fill:#c7b18a" letter-spacing="3">FRONTLINE / ROUND 6 / DESIGN REFERENCE</text><text x="55" y="115" font-size="42" style="fill:#edf1ed" >BULWARK-MECH</text><text x="55" y="154" font-size="21" style="fill:#8bd1d4" >Ground anchor / enclosed pilot cockpit</text><image href="../vehicles/bulwark-mech/front-3q.png" xlink:href="../vehicles/bulwark-mech/front-3q.png" x="40" y="205" width="700" height="680" preserveAspectRatio="xMidYMid meet"/><text x="790" y="245" font-size="18" style="fill:#c7b18a" letter-spacing="2">ROLE</text><text x="790" y="283" font-size="23" style="fill:#c6d3cc" >Hold a defensive lane or break a ground</text><text x="790" y="315" font-size="23" style="fill:#c6d3cc" >formation.</text><text x="790" y="387" font-size="18" style="fill:#c7b18a" letter-spacing="2">LIMITS</text><text x="790" y="425" font-size="23" style="fill:#c6d3cc" >Slow turning, finite cannon/rockets, exposed</text><text x="790" y="457" font-size="23" style="fill:#c6d3cc" >rear radiator.</text><text x="790" y="529" font-size="18" style="fill:#c7b18a" letter-spacing="2">MODEL SEPARATION</text><text x="790" y="567" font-size="23" style="fill:#c6d3cc" >Articulate leg joints, weapon arms, rear hatch,</text><text x="790" y="599" font-size="23" style="fill:#c6d3cc" >radiator and damage panels.</text><text x="790" y="671" font-size="18" style="fill:#c7b18a" letter-spacing="2">COUNTERPLAY</text><text x="790" y="709" font-size="23" style="fill:#c6d3cc" >Infantry protects flanks and services the mech;</text><text x="790" y="741" font-size="23" style="fill:#c6d3cc" >tight interiors remain infantry objectives.</text><text x="55" y="934" font-size="18" style="fill:#a8b9b1" >ART + PLAYTEST PROPOSAL / Claude owns meshes, rigging, controls and balance.</text><text x="55" y="967" font-size="17" style="fill:#a8b9b1" >Use the isolated gray reference for modeling. This annotated card is a handoff aid.</text></svg>