<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="1000" viewBox="0 0 1600 1000"><style>text{font-family:Arial,Helvetica,sans-serif;fill:#edf1ed} .mono{font-family:Menlo,monospace}</style><rect x="0" y="0" width="1600" height="1000" rx="4" fill="#101a20" fill-opacity="1" stroke="#101a20"/><text x="55" y="62" font-size="18" style="fill:#c7b18a" letter-spacing="3">FRONTLINE / ROUND 6 / DESIGN REFERENCE</text><text x="55" y="115" font-size="42" style="fill:#edf1ed" >STORM-MOTH</text><text x="55" y="154" font-size="21" style="fill:#8bd1d4" >3 m wingspan target / local disruption</text><image href="../flyers/storm-moth-front-3q.png" xlink:href="../flyers/storm-moth-front-3q.png" x="40" y="205" width="700" height="680" preserveAspectRatio="xMidYMid meet"/><text x="790" y="245" font-size="18" style="fill:#c7b18a" letter-spacing="2">ROLE</text><text x="790" y="283" font-size="23" style="fill:#c6d3cc" >Create a bounded area of support interference.</text><text x="790" y="355" font-size="18" style="fill:#c7b18a" letter-spacing="2">TELL</text><text x="790" y="393" font-size="23" style="fill:#c6d3cc" >Orange resonance organ pulses before a short</text><text x="790" y="425" font-size="23" style="fill:#c6d3cc" >disruption burst.</text><text x="790" y="497" font-size="18" style="fill:#c7b18a" letter-spacing="2">WEAK POINT</text><text x="790" y="535" font-size="23" style="fill:#c6d3cc" >Shoot throat or leave the area. Never disable</text><text x="790" y="567" font-size="23" style="fill:#c6d3cc" >manual flight controls.</text><text x="790" y="639" font-size="18" style="fill:#c7b18a" letter-spacing="2">READABILITY</text><text x="790" y="677" font-size="23" style="fill:#c6d3cc" >Broad four-wing moth profile, antenna horns and</text><text x="790" y="709" font-size="23" style="fill:#c6d3cc" >ribbed orange throat.</text><text x="55" y="934" font-size="18" style="fill:#a8b9b1" >ART + PLAYTEST PROPOSAL / Claude owns meshes, rigging, controls and balance.</text><text x="55" y="967" font-size="17" style="fill:#a8b9b1" >Use the isolated gray reference for modeling. This annotated card is a handoff aid.</text></svg>